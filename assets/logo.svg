  <!-- Outer Architectural Diamond / Hexagon Shield -->
  <path d="M24 4 L42 14 V34 L24 44 L6 34 V14 Z" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round" fill="none"/>
  
